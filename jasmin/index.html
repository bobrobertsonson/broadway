<body>
  <div id="game"></div>

  <div id="touch" aria-hidden="true">
    <div class="pad left">
      <button data-key="left" aria-label="left">&#9664;</button>
      <button data-key="right" aria-label="right">&#9654;</button>
    </div>
    <div class="pad right">
      <button data-key="action" class="small hidden" aria-label="pen">&#9998;</button>
      <button data-key="jump" class="big" aria-label="jump">&#9650;</button>
    </div>
  </div>

  <div id="rotate">
    <div>Turn your phone sideways to play</div>
  </div>
